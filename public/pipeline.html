<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Inmobiliaria — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f8;
    --panel: #ffffff;
    --border: #e6e8f0;
    --text: #1a1d29;
    --text-dim: #6b7280;
    --text-faint: #9ca3af;

    --sidebar-bg: #14162a;
    --sidebar-bg-hover: #1e2138;
    --sidebar-bg-active: #2a2e52;
    --sidebar-border: #24273f;
    --sidebar-text-dim: #7d8299;

    --accent: #6d5ef8;
    --accent-dim: #6d5ef822;
    --accent-strong: #5a4be0;

    --hot: #ef4a5f;
    --warm: #f5a623;
    --cold: #9aa1b5;
    --new: #3f8efc;
    --contacted: #f39c12;
    --visit: #9b59b6;
    --negotiation: #16a085;
    --closed: #1f9d55;

    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  /* ============ TOP NAV (shared with dashboard) ============ */
  .topnav {
    height: 58px;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--sidebar-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .topnav .brand {
    display: flex; align-items: center; gap: 10px;
    color: #fff; font-weight: 700; font-size: 1.05em; letter-spacing: -0.01em;
  }
  .topnav .brand .mark {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, var(--accent), #9b8cff);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1em;
  }
  .topnav .navlinks { display: flex; gap: 4px; }
  .topnav .navlinks a {
    color: var(--sidebar-text-dim); text-decoration: none;
    font-size: 0.88em; font-weight: 600;
    padding: 8px 14px; border-radius: 8px;
    transition: all .15s;
  }
  .topnav .navlinks a:hover { color: #fff; background: var(--sidebar-bg-hover); }
  .topnav .navlinks a.active { color: #fff; background: var(--sidebar-bg-active); }
  .topnav .summary { color: var(--sidebar-text-dim); font-size: 0.82em; font-weight: 500; }

  .board {
    display: flex; gap: 14px; padding: 18px;
    height: calc(100vh - 58px);
    overflow-x: auto; align-items: flex-start;
  }
  .board::-webkit-scrollbar { height: 8px; }
  .board::-webkit-scrollbar-thumb { background: #d7dae3; border-radius: 4px; }

  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 272px; max-width: 272px;
    display: flex; flex-direction: column; max-height: 100%;
    box-shadow: 0 1px 2px rgba(20,22,42,0.03);
  }
  .column-header {
    padding: 14px 14px 12px;
    font-weight: 700; font-size: 0.82em; color: var(--text);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .column-header .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--stage-color, var(--accent)); margin-right: 7px;
  }
  .column-count {
    background: var(--bg); border-radius: 12px; padding: 2px 9px;
    font-size: 0.78em; color: var(--text-dim); font-weight: 600;
  }
  .column-body { padding: 10px; overflow-y: auto; flex: 1; }
  .column-body::-webkit-scrollbar { width: 5px; }
  .column-body::-webkit-scrollbar-thumb { background: #e2e4ec; border-radius: 3px; }
  .column-body.drag-over { background: var(--accent-dim); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px; margin-bottom: 9px;
    box-shadow: 0 1px 2px rgba(20,22,42,0.05);
    cursor: grab;
    border-left: 3px solid var(--stage-color, var(--accent));
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 3px 10px rgba(20,22,42,0.09); }
  .card:active { cursor: grabbing; }
  .card-name { font-weight: 700; color: var(--text); font-size: 0.9em; margin-bottom: 5px; }
  .card-sub { font-size: 0.75em; color: var(--text-faint); margin-bottom: 8px; }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-size: 0.68em; padding: 3px 8px; border-radius: 10px;
    background: var(--bg); color: var(--text-dim); font-weight: 600;
  }
  .tag.temp-Caliente { background: #fde8ea; color: var(--hot); }
  .tag.temp-Tibio { background: #fef3dd; color: #c9821a; }
  .tag.temp-Frio { background: #eef0f4; color: var(--cold); }
  .card-msg {
    font-size: 0.78em; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-time { font-size: 0.68em; color: var(--text-faint); margin-top: 7px; }

  .empty-col { text-align: center; color: var(--text-faint); font-size: 0.8em; padding: 24px 0; }
</style>
</head>
<body>
  <div class="topnav">
    <div class="brand"><span class="mark">🏢</span> Loop Inmobiliaria</div>
    <div class="navlinks">
      <a href="/dashboard">💬 Chats</a>
      <a href="/pipeline" class="active">📋 Pipeline</a>
    </div>
    <div class="summary" id="summary">Loading…</div>
  </div>

  <div class="board" id="board"></div>

<script>
// Display-only translation layer. The actual stage/temperature values
// stored in the database and sent to the API stay in Spanish (NUEVO,
// Caliente, etc.) — only what's shown on screen here is English. If this
// needs to go back to Spanish for the client later, just clear these two
// maps (or set them to identity) — nothing else needs to change.
const STAGE_LABELS = {
  NUEVO: "NEW", CALIFICANDO: "QUALIFYING", CALIENTE: "HOT",
  CONTACTADO: "CONTACTED", VISITA: "VISIT", NEGOCIACION: "NEGOTIATION", CERRADO: "CLOSED",
};
const TEMP_LABELS = { Caliente: "Hot", Tibio: "Warm", Frio: "Cold" };

const STAGE_COLORS = {
  NUEVO: "var(--new)", CALIFICANDO: "var(--accent)", CALIENTE: "var(--hot)",
  CONTACTADO: "var(--contacted)", VISITA: "var(--visit)", NEGOCIACION: "var(--negotiation)", CERRADO: "var(--closed)",
};
let stages = [];
let leadsByPhone = {};
let draggedPhone = null;
let lastSignature = null; // skip re-render when nothing actually changed, so column scroll position + drag state survive polling

async function load() {
  const r = await (await fetch('/api/pipeline')).json();
  if (!r.success) {
    document.getElementById('board').innerHTML = `<p style="padding:20px;color:var(--hot);">Error loading pipeline: ${r.error}</p>`;
    return;
  }
  stages = r.stages;
  leadsByPhone = {};
  r.data.forEach(l => leadsByPhone[l.phone] = l);

  const signature = JSON.stringify(r.data.map(l => [l.phone, l.stage, l.temperature, l.last_message, l.name]));
  if (signature === lastSignature) {
    updateSummary(r.data);
    return; // nothing changed — don't touch the DOM (keeps scroll position + hover state stable)
  }
  lastSignature = signature;
  render(r.data);
}

function updateSummary(leads) {
  const hot = leads.filter(l => l.temperature === 'Caliente').length;
  document.getElementById('summary').textContent = `${leads.length} leads · ${hot} hot`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(leads) {
  const board = document.getElementById('board');
  board.innerHTML = '';
  updateSummary(leads);

  stages.forEach(stage => {
    const col = document.createElement('div');
    col.className = 'column';
    col.style.setProperty('--stage-color', STAGE_COLORS[stage] || 'var(--accent)');

    const stageLeads = leads.filter(l => l.stage === stage);
    col.innerHTML = `
      <div class="column-header">
        <span><span class="dot"></span>${STAGE_LABELS[stage] || stage}</span>
        <span class="column-count">${stageLeads.length}</span>
      </div>
      <div class="column-body" data-stage="${stage}"></div>`;

    const body = col.querySelector('.column-body');
    body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
    body.addEventListener('drop', e => onDrop(e, stage, body));

    if (stageLeads.length === 0) {
      body.innerHTML = '<div class="empty-col">No leads</div>';
    } else {
      stageLeads.forEach(l => body.appendChild(makeCard(l, stage)));
    }
    board.appendChild(col);
  });
}

function makeCard(l, stage) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.style.setProperty('--stage-color', STAGE_COLORS[stage] || 'var(--accent)');
  card.dataset.phone = l.phone;

  const time = l.updated_at ? new Date(l.updated_at).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '';
  card.innerHTML = `
    <div class="card-name">${escapeHtml(l.name || l.phone)}</div>
    <div class="card-sub">${escapeHtml(l.channel || 'WhatsApp')} ${l.property_id ? '· prop #' + escapeHtml(l.property_id) : ''}</div>
    <div class="card-tags">
      ${l.temperature ? `<span class="tag temp-${l.temperature}">${TEMP_LABELS[l.temperature] || l.temperature}</span>` : ''}
      ${l.zone ? `<span class="tag">${escapeHtml(l.zone)}</span>` : ''}
      ${l.budget ? `<span class="tag">$${Number(l.budget).toLocaleString()}</span>` : ''}
    </div>
    <div class="card-msg">${escapeHtml(l.last_message || '')}</div>
    <div class="card-time">${time}</div>`;

  card.addEventListener('dragstart', () => { draggedPhone = l.phone; card.style.opacity = '0.5'; });
  card.addEventListener('dragend', () => { card.style.opacity = '1'; });
  return card;
}

async function onDrop(e, newStage, body) {
  e.preventDefault();
  body.classList.remove('drag-over');
  if (!draggedPhone) return;
  const lead = leadsByPhone[draggedPhone];
  if (!lead || lead.stage === newStage) return;

  lead.stage = newStage; // optimistic update
  lastSignature = null; // force the next render to reflect this change
  render(Object.values(leadsByPhone));

  try {
    const r = await (await fetch(`/api/pipeline/${draggedPhone}/stage`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stage: newStage }),
    })).json();
    if (!r.success) { alert('Could not save stage: ' + r.error); lastSignature = null; load(); }
  } catch (err) {
    alert('Network error saving stage');
    lastSignature = null;
    load();
  }
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
