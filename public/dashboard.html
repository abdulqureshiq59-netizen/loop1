<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Inmobiliaria - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            height: 100vh;
            gap: 0;
        }
        
        /* ============ SIDEBAR ============ */
        .sidebar {
            background: #2c3e50;
            color: white;
            overflow-y: auto;
            border-right: 1px solid #34495e;
        }
        
        .logo {
            padding: 20px;
            border-bottom: 1px solid #34495e;
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .stats {
            padding: 15px;
            border-bottom: 1px solid #34495e;
        }
        
        .stat-item {
            margin: 10px 0;
            padding: 10px;
            background: #34495e;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .stat-label {
            color: #95a5a6;
            font-size: 0.8em;
        }
        
        .stat-value {
            color: #3498db;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .search-box {
            padding: 15px;
            border-bottom: 1px solid #34495e;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #34495e;
            color: white;
            font-size: 0.9em;
        }
        
        .search-box input::placeholder {
            color: #95a5a6;
        }
        
        .conversations {
            padding: 10px;
        }
        
        .conversation-item {
            padding: 12px;
            margin: 8px 0;
            background: #34495e;
            border-radius: 6px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }
        
        .conversation-item:hover {
            background: #3d5a73;
        }
        
        .conversation-item.active {
            background: #3498db;
            border-left-color: #fff;
        }
        
        .conv-name {
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 4px;
        }
        
        .conv-preview {
            font-size: 0.85em;
            color: #bdc3c7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conv-time {
            font-size: 0.75em;
            color: #95a5a6;
            margin-top: 4px;
        }
        
        /* ============ MAIN CHAT AREA ============ */
        .main-content {
            display: flex;
            flex-direction: column;
            background: white;
            border-right: 1px solid #e0e0e0;
        }
        
        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header-info h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .chat-header-info p {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        
        .chat-controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-ai {
            background: #27ae60;
            color: white;
        }
        
        .btn-ai:hover {
            background: #229954;
        }
        
        .btn-ai.inactive {
            background: #95a5a6;
        }
        
        .btn-human {
            background: #3498db;
            color: white;
        }
        
        .btn-human:hover {
            background: #2980b9;
        }
        
        .btn-human.inactive {
            background: #95a5a6;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .message.customer {
            justify-content: flex-start;
        }
        
        .message.ai {
            justify-content: flex-end;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.95em;
            line-height: 1.4;
        }
        
        .message.customer .message-bubble {
            background: #ecf0f1;
            color: #2c3e50;
        }
        
        .message.ai .message-bubble {
            background: #3498db;
            color: white;
        }
        
        .message-time {
            font-size: 0.75em;
            color: #95a5a6;
            margin-top: 5px;
        }
        
        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .input-area button {
            padding: 12px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* ============ RIGHT PANEL ============ */
        .right-panel {
            background: #f8f9fa;
            overflow-y: auto;
            border-left: 1px solid #e0e0e0;
        }
        
        .panel-section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .panel-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .info-item {
            margin: 12px 0;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }
        
        .info-label {
            color: #7f8c8d;
            font-size: 0.85em;
            margin-bottom: 4px;
        }
        
        .info-value {
            color: #2c3e50;
            font-weight: bold;
            word-break: break-word;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .badge-new {
            background: #f39c12;
            color: white;
        }
        
        .badge-hot {
            background: #e74c3c;
            color: white;
        }
        
        .badge-warm {
            background: #f1c40f;
            color: #2c3e50;
        }
        
        .badge-cold {
            background: #95a5a6;
            color: white;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo">🏢 Loop IA</div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Total Leads</div>
                    <div class="stat-value" id="totalLeads">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Hot Leads</div>
                    <div class="stat-value" id="hotLeads">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">New</div>
                    <div class="stat-value" id="newLeads">0</div>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search customer...">
            </div>
            
            <div class="conversations" id="conversationsList"></div>
        </div>
        
        <!-- MAIN CHAT AREA -->
        <div class="main-content">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h2 id="customerName">Select a conversation</h2>
                    <p id="customerPhone">📱 No customer selected</p>
                </div>
                <div class="chat-controls">
                    <button class="btn btn-ai active" onclick="toggleAI(this)">🤖 AI ACTIVE</button>
                    <button class="btn btn-human inactive" onclick="toggleHuman(this)">👤 TAKE CONTROL</button>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div style="font-size: 3em; margin-bottom: 10px;">💬</div>
                    <p>Select a conversation to view messages</p>
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
        
        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="panel-section">
                <h3>Lead Info</h3>
                
                <div class="info-item">
                    <div class="info-label">Status</div>
                    <div id="leadStatus" class="badge badge-new">NEW</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Name</div>
                    <div class="info-value" id="infoName">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Phone</div>
                    <div class="info-value" id="infoPhone">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Channel</div>
                    <div class="info-value" id="infoChannel">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Assigned To</div>
                    <div class="info-value" id="infoAgent">-</div>
                </div>
            </div>
            
            <div class="panel-section">
                <h3>Preferences</h3>
                
                <div class="info-item">
                    <div class="info-label">Operation</div>
                    <div class="info-value" id="infoOperation">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Type</div>
                    <div class="info-value" id="infoType">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Zone</div>
                    <div class="info-value" id="infoZone">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Budget</div>
                    <div class="info-value" id="infoBudget">-</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">Bedrooms</div>
                    <div class="info-value" id="infoBedrooms">-</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let allLeads = [];
        let selectedLead = null;
        
        const GAS_DEPLOYMENT_URL = "https://script.google.com/macros/s/AKfycbwA4CpRRFr62k_m_rYP9cAZkgCyfSIzxFmTXEo6Lv3JuH0svRpR97f48E9OkMdLxquNtw/usercontent";
        
        // Render conversations list
        function renderConversations() {
            const list = document.getElementById('conversationsList');
            list.innerHTML = '';
            
            allLeads.forEach(lead => {
                const item = document.createElement('div');
                item.className = 'conversation-item';
                item.innerHTML = `
                    <div class="conv-name">${lead.customer_name}</div>
                    <div class="conv-preview">${lead.last_message || 'No messages'}</div>
                    <div class="conv-time">${new Date(lead.created_at).toLocaleDateString()}</div>
                `;
                item.onclick = () => selectLead(lead);
                list.appendChild(item);
            });
        }
        
        // Select a lead
        function selectLead(lead) {
            selectedLead = lead;
            
            // Update header
            document.getElementById('customerName').textContent = lead.customer_name;
            document.getElementById('customerPhone').textContent = `📱 ${lead.phone} • ${lead.channel}`;
            
            // Update right panel
            document.getElementById('infoName').textContent = lead.customer_name;
            document.getElementById('infoPhone').textContent = lead.phone;
            document.getElementById('infoChannel').textContent = lead.channel;
            document.getElementById('infoAgent').textContent = lead.assigned_agent;
            document.getElementById('infoOperation').textContent = lead.type;
            document.getElementById('infoType').textContent = lead.type;
            document.getElementById('infoZone').textContent = lead.zone;
            document.getElementById('infoBudget').textContent = lead.budget;
            document.getElementById('infoBedrooms').textContent = lead.bedrooms;
            
            // Update status badge
            const statusBadge = document.getElementById('leadStatus');
            statusBadge.textContent = lead.status || 'NEW';
            statusBadge.className = `badge badge-${lead.status.toLowerCase()}`;
            
            // Update messages
            renderMessages();
            
            // Highlight active conversation
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.conversation-item').classList.add('active');
        }
        
        // Render messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = `
                <div class="message customer">
                    <div>
                        <div class="message-bubble">${selectedLead.last_message || 'No messages yet'}</div>
                        <div class="message-time">${new Date(selectedLead.created_at).toLocaleString()}</div>
                    </div>
                </div>
                <div class="message ai">
                    <div>
                        <div class="message-bubble">¡Hola! Bienvenido a Loop Inmobiliaria. ¿Cómo puedo ayudarte?</div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            `;
        }
        
        // Load statistics
       // Replace this function in dashboard.html

async function loadLeads() {
    try {
        const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=getLeads`);
        const text = await response.text();
        const result = JSON.parse(text);
        
        if (result.success) {
            allLeads = result.data;
            renderConversations();
            loadStats();
        } else {
            console.error("Error:", result.error);
        }
    } catch (err) {
        console.error('Error loading leads:', err);
    }
}

async function loadStats() {
    try {
        const response = await fetch(`${GAS_DEPLOYMENT_URL}?action=getStats`);
        const text = await response.text();
        const result = JSON.parse(text);
        
        if (result.success) {
            document.getElementById('totalLeads').textContent = result.data.total;
            document.getElementById('hotLeads').textContent = result.data.hot;
            document.getElementById('newLeads').textContent = result.data.new;
        }
    } catch (err) {
        console.error('Error loading stats:', err);
    }
}

        
        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (input.value.trim() && selectedLead) {
                // Add message to UI
                const container = document.getElementById('messagesContainer');
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message customer';
                msgDiv.innerHTML = `
                    <div>
                        <div class="message-bubble">${input.value}</div>
                        <div class="message-time">Just now</div>
                    </div>
                `;
                container.appendChild(msgDiv);
                input.value = '';
            }
        }
        
        // Toggle AI/Human
        function toggleAI(btn) {
            const humanBtn = document.querySelector('.btn-human');
            btn.classList.toggle('active');
            btn.classList.toggle('inactive');
            humanBtn.classList.toggle('inactive');
            humanBtn.classList.toggle('active');
        }
        
        function toggleHuman(btn) {
            const aiBtn = document.querySelector('.btn-ai');
            btn.classList.toggle('active');
            btn.classList.toggle('inactive');
            aiBtn.classList.toggle('inactive');
            aiBtn.classList.toggle('active');
        }
        
        // Load on page load
        loadLeads();
        setInterval(loadLeads, 10000); // Refresh every 10 seconds
    </script>
</body>
</html>
